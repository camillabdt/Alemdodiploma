name: Verificar plataforma e formulário
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-verificado.txt -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: python -m pytest -q
      - run: node avaliacao/testar_formulario_v3.cjs
      - run: python scripts/testar_fluxo_http.py
